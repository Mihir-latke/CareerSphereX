spring.application.name=careerspherex-backend

# ---- Database ----
# Points at the blank database you already created. Hibernate will create
# every table automatically on first run (see ddl-auto below) — you don't
# need to run any SQL scripts yourself.
#
# Override any of these via environment variables if your setup differs:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:careerspherex}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' = Hibernate creates any missing tables/columns from the entity
# classes on startup, and never deletes existing data. This is what lets
# you start from a completely blank database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Connection pool (HikariCP, bundled with Spring Boot) ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Server ----
server.port=${SERVER_PORT:8080}
